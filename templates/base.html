<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}{{ site_name }}{% endblock %}</title>
<style>
  :root {
    color-scheme: light dark;
    --fg: #1a1a1a;
    --bg: #ffffff;
    --muted: #6b7280;
    --border: #e5e7eb;
    --accent: #2563eb;
    --err: #dc2626;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --fg: #e5e7eb;
      --bg: #111214;
      --muted: #9ca3af;
      --border: #2a2d33;
      --accent: #60a5fa;
      --err: #f87171;
    }
  }
  * { box-sizing: border-box; }
  body {
    max-width: 38rem;
    margin: 3rem auto;
    padding: 0 1.25rem;
    font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    font-size: 16px;
    line-height: 1.65;
    color: var(--fg);
    background: var(--bg);
  }
  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }
  nav {
    display: flex;
    align-items: center;
    gap: 1.25rem;
    margin-bottom: 2.5rem;
    padding-bottom: 1rem;
    border-bottom: 1px solid var(--border);
    font-size: 0.9rem;
  }
  nav a:first-child {
    font-weight: 600;
    color: var(--fg);
    margin-right: auto;
  }
  h1, h2, h3 { line-height: 1.3; font-weight: 600; }
  h1 { font-size: 1.6rem; }
  h2 { font-size: 1.2rem; }
  article { margin-bottom: 2.5rem; }
  time { color: var(--muted); font-size: 0.85rem; }
  textarea, input, button {
    font-family: inherit;
    font-size: 1rem;
  }
  textarea, input[type="text"], input[type="password"] {
    width: 100%;
    box-sizing: border-box;
    margin-bottom: 0.75rem;
    padding: 0.5rem 0.6rem;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: var(--bg);
    color: var(--fg);
  }
  textarea { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
  .post-list-item { margin-bottom: 1.75rem; }
  .err { color: var(--err); }
  form.inline { display: inline; }
  button {
    cursor: pointer;
    padding: 0.5rem 1rem;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: var(--fg);
    color: var(--bg);
  }
  button:hover { opacity: 0.85; }
  {% if custom_css %}{{ custom_css | safe }}{% endif %}
</style>
</head>
<body>
<nav>
  <a href="/">{{ site_name }}</a>
  {% if logged_in %}
    <a href="/admin">admin</a>
    <form class="inline" method="post" action="/admin/logout">
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
      <button type="submit">logout</button>
    </form>
  {% else %}
    <a href="/admin/login">login</a>
  {% endif %}
</nav>
{% block content %}{% endblock %}
</body>
</html>
