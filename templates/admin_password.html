{% extends "base.html" %}
{% block title %}change password — {{ site_name }}{% endblock %}
{% block content %}
<h1>change password</h1>
{% if error %}<p class="err">{{ error }}</p>{% endif %}
{% if success %}<p>{{ success }}</p>{% endif %}
<form method="post" action="/admin/password">
  <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
  <input type="password" name="current_password" placeholder="current password" autocomplete="current-password" required>
  <input type="password" name="new_password" placeholder="new password (min 8 characters)" autocomplete="new-password" required>
  <input type="password" name="confirm_password" placeholder="confirm new password" autocomplete="new-password" required>
  <button type="submit">update password</button>
</form>
<p><a href="/admin">back to admin</a></p>
{% endblock %}
