[package]
name = "tor-cms"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = { version = "0.7.9", features = ["macros", "multipart"] }
tokio = { version = "1.42.0", features = ["rt-multi-thread", "macros", "net", "signal", "fs"] }
tower-http = { version = "0.6.2", features = ["fs", "catch-panic"] }
sha2 = "0.10.8"
hmac = "0.12.1"
image = { version = "0.25.5", default-features = false, features = ["jpeg", "png", "webp", "gif"] }
tower-cookies = "0.10.0"
rusqlite = { version = "0.32.1", features = ["bundled", "backup"] }
tera = { version = "1.20.0", default-features = false }
serde = { version = "1.0.217", features = ["derive"] }
pulldown-cmark = { version = "0.12.2", default-features = false, features = ["html"] }
argon2 = "0.5.3"
rand = "0.8.5"
ammonia = "4.0.0"
time = { version = "0.3.37", features = ["formatting"] }

[dev-dependencies]
# Dev-only — never linked into the shipped binary (cargo keeps
# dev-dependencies out of normal/release builds), so this doesn't violate
# the "no HTTP client in the dependency tree" design rule above.
ureq = { version = "2.10", features = ["cookies"] }
tempfile = "3.14"

[profile.release]
opt-level = "z"
lto = true
strip = true
