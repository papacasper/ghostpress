{% extends "base.html" %}
{% block title %}{{ post.title }} — {{ site_name }}{% endblock %}
{% block content %}
<article>
  <h1>{{ post.title }}</h1>
  <time>{{ post.created_at }}</time>
  {{ post.body_html | safe }}
  {% if tags %}
  <p>
    {% for t in tags %}<a href="/tag/{{ t }}">#{{ t }}</a>{% if not loop.last %} {% endif %}{% endfor %}
  </p>
  {% endif %}
</article>
{% endblock %}
