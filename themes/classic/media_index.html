{% extends "base.html" %}
{% block title %}watch — {{ site_name }}{% endblock %}
{% block content %}
<h1>watch</h1>
{% for movie in movies %}
<div class="post-list-item">
  <h2><a href="/watch/{{ movie.slug }}">{{ movie.title }}</a></h2>
  {% if movie.year %}<time>{{ movie.year }}</time>{% endif %}
</div>
{% else %}
<p>No movies in the library yet.</p>
{% endfor %}
{% endblock %}
