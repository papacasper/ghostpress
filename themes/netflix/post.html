{% extends "base.html" %}
{% block title %}{{ post.title }} — {{ site_name }}{% endblock %}
{% block content %}
<style>
  .hero {
    margin: 0 -4vw 2rem;
    padding: 3.5rem 4vw 2.5rem;
    background: linear-gradient(135deg, #1f1c18, #8e0e00 160%);
  }
  .hero h1 { margin: 0 0 0.5rem; font-size: 2.1rem; }
  .tag-row { margin-top: 1rem; }
  .tag-row a {
    display: inline-block;
    margin: 0 0.4rem 0.4rem 0;
    padding: 0.25rem 0.65rem;
    border-radius: 3px;
    background: var(--bg-raised);
    color: var(--muted);
    font-size: 0.8rem;
  }
  .tag-row a:hover { color: var(--fg); }
</style>
<div class="hero">
  <h1>{{ post.title }}</h1>
  <time>{{ post.created_at }}</time>
</div>
<article>
  {{ post.body_html | safe }}
  {% if tags %}
  <p class="tag-row">
    {% for t in tags %}<a href="/tag/{{ t }}">#{{ t }}</a>{% endfor %}
  </p>
  {% endif %}
</article>
{% endblock %}
