{% extends "base.html" %}
{% block title %}{{ page.title }} — {{ site_name }}{% endblock %}
{% block content %}
<style>
  .hero {
    margin: 0 -4vw 2rem;
    padding: 3.5rem 4vw 2.5rem;
    background: linear-gradient(135deg, #0f2027, #2c5364 160%);
  }
  .hero h1 { margin: 0; font-size: 2.1rem; }
</style>
<div class="hero"><h1>{{ page.title }}</h1></div>
<article>
  {{ page.body_html | safe }}
</article>
{% endblock %}
