{% extends "base.html" %}
{% block title %}{{ movie.title }} — {{ site_name }}{% endblock %}
{% block content %}
<style>
  .hero {
    margin: 0 -4vw 1.5rem;
    padding: 2.5rem 4vw;
    background: linear-gradient(135deg, #1f1c18, #141414 160%);
  }
  .hero h1 { margin: 0; font-size: 2rem; }
  .hero time { color: var(--muted); }
  video { width: 100%; max-width: 100%; border-radius: 6px; background: #000; }
</style>
<div class="hero">
  <h1>{{ movie.title }}</h1>
  {% if movie.year %}<time>{{ movie.year }}</time>{% endif %}
</div>
<video controls {% if movie.poster_url %}poster="{{ movie.poster_url }}"{% endif %}>
  <source src="{{ movie.video_url }}">
  Your browser doesn't support HTML5 video.
</video>
<p><a href="/watch">&larr; back to library</a></p>
{% endblock %}
